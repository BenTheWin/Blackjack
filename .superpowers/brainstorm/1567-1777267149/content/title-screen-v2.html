<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Title Screen Mockup v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    gap: 16px;
  }
  .label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .screen {
    width: 100%;
    max-width: 560px;
    aspect-ratio: 16/10;
    background: radial-gradient(ellipse at center, #1a6b3a 0%, #0d4a26 50%, #082e18 100%);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border: 1px solid rgba(201,168,76,0.2);
  }
  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 3px,
      rgba(255,255,255,0.015) 3px,
      rgba(255,255,255,0.015) 4px
    );
    pointer-events: none;
  }
  .screen::after {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 8px;
    pointer-events: none;
  }
  .suit-row {
    font-size: 13px;
    letter-spacing: 8px;
    color: rgba(201,168,76,0.7);
    font-weight: 700;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }
  .title-text {
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 900;
    color: #c9a84c;
    letter-spacing: 8px;
    text-shadow: 0 0 30px rgba(201,168,76,0.5), 0 2px 8px rgba(0,0,0,0.6);
    position: relative;
    z-index: 1;
    margin-bottom: 8px;
  }
  .tagline {
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    margin-bottom: 32px;
  }
  .play-btn {
    padding: 12px 40px;
    border: 2px solid #c9a84c;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #c9a84c;
    background: rgba(201,168,76,0.1);
    position: relative;
    z-index: 1;
    cursor: pointer;
    text-transform: uppercase;
  }
  .mute-hint {
    position: absolute;
    bottom: 14px;
    right: 16px;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.25);
    z-index: 1;
  }
  .note {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    font-family: 'Segoe UI', system-ui, sans-serif;
    max-width: 560px;
    text-align: center;
    line-height: 1.6;
  }
  .note strong { color: rgba(255,255,255,0.75); }
</style>
</head>
<body>
  <p class="label">Title Screen — Casino Elegance (no card fans)</p>

  <div class="screen">
    <div class="suit-row">♠ &nbsp; ♥ &nbsp; ♦ &nbsp; ♣</div>
    <div class="title-text">BLACKJACK</div>
    <div class="tagline">Beat the Dealer</div>
    <button class="play-btn">Play Now</button>
    <div class="mute-hint">🔊 Click to mute</div>
  </div>

  <p class="note">
    <strong>Ambient music</strong> starts when you click Play &nbsp;·&nbsp;
    <strong>Mute toggle</strong> bottom-right corner persists across sessions
  </p>
</body>
</html>
