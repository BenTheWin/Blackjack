<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="title-screen">
    <div class="title-suit-row">♠ &nbsp; ♥ &nbsp; ♦ &nbsp; ♣</div>
    <div class="title-heading">BLACKJACK</div>
    <div class="title-tagline">Beat the Dealer</div>
    <button id="playNowBtn" class="btn-action btn-outline title-play-btn">Play Now</button>
    <button id="titleMuteBtn" class="btn-mute">🔊</button>
  </div>

  <div id="app">
    <header class="top-bar">
      <span class="game-title">♠ BLACKJACK ♠</span>
      <div class="balance-area">
        <span class="balance-label">Balance</span>
        <span id="balance" class="balance-amount">$500</span>
        <button id="addFunds" class="btn-add-funds">+ ADD FUNDS</button>
        <button id="gameMuteBtn" class="btn-mute">🔊</button>
      </div>
    </header>

    <main class="table">
      <section class="dealer-area">
        <div id="dealer-label" class="hand-label">Dealer</div>
        <div id="dealer-cards" class="cards-row"></div>
      </section>

      <div class="table-divider"></div>

      <section id="player-area" class="player-area"></section>
    </main>

    <footer id="action-bar" class="action-bar"></footer>
  </div>

  <div id="result-overlay" class="result-overlay"></div>

  <script src="sound.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
